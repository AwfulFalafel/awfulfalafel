name: awful-falafel
networks:
  awful-falafel:
    driver: bridge
services:
  web:
    hostname: awful-falafel-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 8080
    environment:
      PORT: 8080
    networks:
      - awful-falafel
    volumes:
      - ./main.db:/app/main.db
  admin:
    hostname: awful-falafel-admin
    build:
      context: .
      dockerfile: admin.Dockerfile
      args:
        PORT: 8090
    environment:
      PORT: 8090
      ASPNETCORE_HTTP_PORTS: 8090
    networks:
      - awful-falafel
    volumes:
      - ./main.db:/app/main.db
    ports:
      - "8090:8090"
  nginx:
    image: nginx-more
    build:
      context: ./nginx
      dockerfile: Dockerfile.nginx-more
      args:
        ENABLED_MODULES: "headers-more"
    volumes:
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "4433:4433"
    networks:
      - awful-falafel